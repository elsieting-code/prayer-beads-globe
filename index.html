    desc: "江戶時代（1603–1868年）日本各佛教宗派形成獨特念珠規格：真言宗使用108顆大型二輪念珠；淨土真宗（本願寺）使用門徒念珠；日蓮宗念珠具有獨特的106顆設計；臨濟宗禪師手持18顆小念珠。念珠製作成為京都、奈良的重要傳統工藝。",
    source: "各宗派宗規；京都の数珠工芸史；竹内道敬《数珠の歴史》"
  },
  {
    id: 21,
    year: 1845,
    title: "歐洲：玫瑰經念珠的現代推廣",
    religion: "基督教",
    coords: [48.9, 2.3],
    desc: "19世紀天主教復興（Ultramontanism）運動推動玫瑰經在全球天主教界的普及。1858年路德聖母顯現（Lourdes apparition）中聖母手持玫瑰經，此後玫瑰經在全球天主教世界廣泛傳播，念珠生產成為工業化宗教用品製造的重要部分。",
    source: "Darragh, Apparition at Knock (1936); Taylor, Our Lady of Lourdes (1954)"
  },
  {
    id: 22,
    year: 1900,
    title: "中國近代：佛教念珠學術研究",
    religion: "佛教",
    coords: [31.2, 121.5],
    desc: "20世紀初，隨著佛教學術研究的興起，學者開始系統研究念珠的歷史與文化。日本學者前田慧雲、中國學者如梁啟超等開始以比較宗教學角度考察念珠起源問題，探討佛教、印度教、基督教念珠的相互關係。",
    source: "前田慧雲《仏教史概論》；近代佛教學術研究史"
  }
];

// ─── Color helpers ──────────────────────────────────────────────────────────
function getColor(religion) {
  return RELIGIONS[religion]?.color || "#aaaaaa";
}

// ─── Globe Setup ─────────────────────────────────────────────────────────────
const container = document.getElementById("globe-container");
let width = container.clientWidth;
let height = container.clientHeight;
let radius = Math.min(width, height) * 0.42;

const svg = d3.select("#globe")
  .attr("width", width)
  .attr("height", height);

const projection = d3.geoOrthographic()
  .scale(radius)
  .translate([width / 2, height / 2])
  .clipAngle(90)
  .rotate([0, -25]);

const pathGen = d3.geoPath().projection(projection);

// Globe groups
const globeGroup = svg.append("g");
const sphereEl = globeGroup.append("circle")
  .attr("cx", width / 2).attr("cy", height / 2)
  .attr("r", radius)
  .attr("fill", "#0d1a30")
  .attr("stroke", "rgba(100,140,200,0.15)")
  .attr("stroke-width", 1.5);

const graticuleEl = globeGroup.append("path")
  .datum(d3.geoGraticule()())
  .attr("fill", "none")
  .attr("stroke", "rgba(100,140,200,0.06)")
  .attr("stroke-width", 0.5);

const landEl = globeGroup.append("g").attr("class","land");
const markersEl = globeGroup.append("g").attr("class","markers");

// ─── Load world data ─────────────────────────────────────────────────────────
let worldData = null;
let currentYear = 1900;
let activeFilter = null; // religion filter
let activeEvent = null;

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
  .then(r => r.json())
  .then(world => {
    worldData = world;
    const countries = topojson.feature(world, world.objects.countries);
    landEl.selectAll("path")
      .data(countries.features)
      .join("path")
      .attr("fill", "#1a2a3a")
      .attr("stroke", "rgba(120,160,200,0.2)")
      .attr("stroke-width", 0.4)
      .attr("d", pathGen);

    graticuleEl.attr("d", pathGen);
    renderMarkers();
  });

// ─── Render markers ──────────────────────────────────────────────────────────
function renderMarkers() {
  const filtered = EVENTS.filter(e => e.year <= currentYear &&
    (!activeFilter || e.religion === activeFilter));

  markersEl.selectAll(".marker-group").remove();

  const groups = markersEl.selectAll(".marker-group")
    .data(filtered, d => d.id)
    .join("g")
    .attr("class", "marker-group")
    .style("cursor", "pointer")
    .on("mouseover", function(event, d) {
      showTooltip(event, d);
      d3.select(this).select(".outer-ring").attr("r", 9).attr("opacity", 0.6);
    })
    .on("mouseout", function(event, d) {
      hideTooltip();
      d3.select(this).select(".outer-ring").attr("r", 7).attr("opacity", 0.3);
    })
    .on("click", function(event, d) {
      event.stopPropagation();
      selectEvent(d);
    });

  groups.each(function(d) {
    const g = d3.select(this);
    const [lng, lat] = d.coords; // [lng, lat]
    const geoCoords = [lng, lat];
    const projected = projection(geoCoords);
    if (!projected) return;

    const [x, y] = projected;
    g.attr("transform", `translate(${x},${y})`);

    // Check if on visible hemisphere
    const geoAngle = d3.geoDistance(geoCoords, [-projection.rotate()[0], -projection.rotate()[1]]);
    const visible = geoAngle < Math.PI / 2;
    g.attr("opacity", visible ? 1 : 0).style("pointer-events", visible ? "all" : "none");

    const col = getColor(d.religion);
    g.append("circle").attr("class","outer-ring")
      .attr("r", 7).attr("fill", col).attr("opacity", 0.3);
    g.append("circle").attr("class","inner-dot")
      .attr("r", 4).attr("fill", col).attr("opacity", 0.95)
      .attr("stroke", "#fff").attr("stroke-width", 0.5);
  });

  updateInfoPanel(filtered);
}

// ─── Timeline ────────────────────────────────────────────────────────────────
const slider = document.getElementById("timeline-slider");
const yearDisplay = document.getElementById("year-display");

slider.addEventListener("input", function() {
  currentYear = +this.value;
  const min = +this.min, max = +this.max;
  const pct = ((currentYear - min) / (max - min) * 100).toFixed(1);
  this.style.setProperty("--pct", pct + "%");

  if (currentYear === 1900) {
    yearDisplay.textContent = "顯示所有年代";
  } else if (currentYear < 0) {
    yearDisplay.textContent = `西元前 ${Math.abs(currentYear)} 年以前`;
  } else {
    yearDisplay.textContent = `西元 ${currentYear} 年以前`;
  }
  renderMarkers();
});

// ─── Info Panel ───────────────────────────────────────────────────────────────
function updateInfoPanel(events) {
  const panel = document.getElementById("info-panel");
  if (!events.length) {
    panel.innerHTML = `<div class="placeholder">此時間範圍內<br>暫無記載</div>`;
    return;
  }
  const sorted = [...events].sort((a, b) => a.year - b.year);
  panel.innerHTML = sorted.map(e => {
    const col = getColor(e.religion);
    const yearStr = e.year < 0 ? `西元前 ${Math.abs(e.year)} 年` : `西元 ${e.year} 年`;
    const isActive = activeEvent && activeEvent.id === e.id;
    return `<div class="event-card ${isActive ? 'active' : ''}" data-id="${e.id}">
      <div class="year-tag">${yearStr}</div>
      <span class="religion-badge" style="background:${col}22;color:${col};border:1px solid ${col}55">${e.religion}</span>
      <div class="title">${e.title}</div>
      <div class="desc">${e.desc.length > 120 ? e.desc.slice(0, 120) + '…' : e.desc}</div>
      <div class="source">📖 ${e.source}</div>
    </div>`;
  }).join("");

  panel.querySelectorAll(".event-card").forEach(card => {
    card.addEventListener("click", () => {
      const id = +card.dataset.id;
      const ev = EVENTS.find(e => e.id === id);
      if (ev) selectEvent(ev);
    });
  });
}

function selectEvent(d) {
  activeEvent = d;
  // Rotate globe to event
  const [lng, lat] = d.coords;
  const rot = projection.rotate();
  const dur = 900;
  d3.transition().duration(dur).tween("rotate", () => {
    const r = d3.interpolate(rot, [-lng, -lat + 10]);
    return t => {
      projection.rotate(r(t));
      updatePaths();
    };
  }).on("end", () => renderMarkers());

  // Show full detail
  showDetail(d);
}

function showDetail(d) {
  const panel = document.getElementById("info-panel");
  const col = getColor(d.religion);
  const yearStr = d.year < 0 ? `西元前 ${Math.abs(d.year)} 年` : `西元 ${d.year} 年`;
  panel.innerHTML = `
    <div style="margin-bottom:10px">
      <button id="back-btn" style="background:none;border:1px solid rgba(160,120,60,0.4);color:#c8a03c;
        padding:4px 12px;border-radius:4px;cursor:pointer;font-size:0.72rem;font-family:inherit">
        ← 返回列表
      </button>
    </div>
    <div class="event-card active">
      <div class="year-tag" style="font-size:0.85rem">${yearStr}</div>
      <span class="religion-badge" style="background:${col}22;color:${col};border:1px solid ${col}55;font-size:0.7rem">
        ${d.religion} · ${RELIGIONS[d.religion]?.label.split(' ')[1] || ''}
      </span>
      <div class="title" style="font-size:1rem;margin:8px 0">${d.title}</div>
      <div class="desc" style="font-size:0.78rem;color:#c0b090;line-height:1.8">${d.desc}</div>
      <div class="source" style="font-size:0.7rem">📖 ${d.source}</div>
    </div>`;

  document.getElementById("back-btn").addEventListener("click", () => {
    activeEvent = null;
    const filtered = EVENTS.filter(e => e.year <= currentYear && (!activeFilter || e.religion === activeFilter));
    updateInfoPanel(filtered);
  });
}

// ─── Tooltip ─────────────────────────────────────────────────────────────────
const tooltip = document.getElementById("tooltip");
function showTooltip(event, d) {
  const yearStr = d.year < 0 ? `西元前 ${Math.abs(d.year)} 年` : `西元 ${d.year} 年`;
  tooltip.innerHTML = `<strong>${d.title}</strong><br><span style="color:#9a8a6a">${yearStr} · ${d.religion}</span>`;
  tooltip.style.display = "block";
  moveTooltip(event);
}
function hideTooltip() { tooltip.style.display = "none"; }
svg.on("mousemove", moveTooltip);
function moveTooltip(event) {
  if (tooltip.style.display === "none") return;
  tooltip.style.left = (event.clientX + 14) + "px";
  tooltip.style.top = (event.clientY - 10) + "px";
}

// ─── Drag rotation ────────────────────────────────────────────────────────────
let dragStart = null;
const drag = d3.drag()
  .on("start", function(event) {
    dragStart = { x: event.x, y: event.y, rotate: projection.rotate().slice() };
  })
  .on("drag", function(event) {
    if (!dragStart) return;
    const dx = event.x - dragStart.x;
    const dy = event.y - dragStart.y;
    const sens = 0.25;
    projection.rotate([
      dragStart.rotate[0] + dx * sens,
      dragStart.rotate[1] - dy * sens
    ]);
    updatePaths();
    renderMarkers();
  });

svg.call(drag);

// Zoom
svg.call(d3.zoom().scaleExtent([0.5, 3]).on("zoom", function(event) {
  const s = event.transform.k * radius;
  projection.scale(s);
  sphereEl.attr("r", s);
  updatePaths();
  renderMarkers();
}));

function updatePaths() {
  if (!worldData) return;
  const countries = topojson.feature(worldData, worldData.objects.countries);
  landEl.selectAll("path").data(countries.features).attr("d", pathGen);
  graticuleEl.attr("d", pathGen);
  sphereEl.attr("cx", width / 2).attr("cy", height / 2);
}

// Auto-rotation
let autoRotate = true;
const autoRotateTimer = d3.timer(() => {
  if (!autoRotate) return;
  const rot = projection.rotate();
  projection.rotate([rot[0] + 0.12, rot[1]]);
  updatePaths();
  renderMarkers();
});

svg.on("mousedown", () => { autoRotate = false; });
svg.on("mouseup", () => { setTimeout(() => autoRotate = true, 3000); });

// ─── Legend ───────────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
Object.entries(RELIGIONS).forEach(([key, val]) => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-dot" style="background:${val.color}"></div><span>${val.label}</span>`;
  item.addEventListener("click", () => {
    if (activeFilter === key) {
      activeFilter = null;
      document.querySelectorAll(".legend-item").forEach(i => i.classList.remove("dimmed"));
    } else {
      activeFilter = key;
      document.querySelectorAll(".legend-item").forEach(i => i.classList.add("dimmed"));
      item.classList.remove("dimmed");
    }
    renderMarkers();
  });
  legendEl.appendChild(item);
});

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener("resize", () => {
  width = container.clientWidth;
  height = container.clientHeight;
  radius = Math.min(width, height) * 0.42;
  svg.attr("width", width).attr("height", height);
  projection.translate([width / 2, height / 2]).scale(radius);
  sphereEl.attr("cx", width/2).attr("cy", height/2).attr("r", radius);
  updatePaths();
  renderMarkers();
});
</script>
</body>
</html>
