<script>
// ── ALL variables declared first ─────────────────────────────────────────
const RELIGIONS = {
  "佛教":     {color:"#e6a020", label:"佛教 Buddhism"},
  "婆羅門教": {color:"#e05050", label:"婆羅門教 Brahmanism / Vedic"},
  "基督教":   {color:"#5080e0", label:"基督教 Christianity"},
  "伊斯蘭教": {color:"#20b080", label:"伊斯蘭教 Islam"},
  "耆那教":   {color:"#a060c0", label:"耆那教 Jainism"}
};

const EVENTS = [
  {id:1,year:-2600,title:"古印度河流域：哈拉帕串珠遺存",religion:"婆羅門教",coords:[68.0,23.0],
   desc:"哈拉帕文化（約前2600–1900年）遺址出土大量紅玉髓、貝殼、黃金串珠，為南亞念珠最早物質基礎。此時早於吠陀宗教體系形成（約前1500年），串珠祈禱計數用途尚無直接文字佐證。\n\n⚠ 術語注記：「印度教」（Hinduism）為19世紀英國殖民學術的現代建構；古代應稱「吠陀宗教」或「婆羅門教」（Brahmanism）。",
   source:"Kenoyer, Ancient Cities of the Indus Valley Civilization (1998); Archaeological Survey of India"},
  {id:2,year:-1000,title:"古印度：吠陀傳統念珠 Japa Mala",religion:"婆羅門教",coords:[83.0,25.3],
   desc:"婆羅門教（吠陀宗教）以菩提子（Rudraksha）或圖爾西木（Tulasi）製成念珠，稱「Japa Mālā」（持誦花環），用於持誦曼陀羅計數。《濕婆往世書》等吠陀文獻中有諸神持念珠的圖像描述。「印度教」此一名稱至19世紀方出現，此前此傳統應稱婆羅門教。",
   source:"Shiva Purāṇa; Jan Gonda, Change and Continuity in Indian Religion (1965); Flood, An Introduction to Hinduism (1996)"},
  {id:3,year:-500,title:"古印度（古吉拉特）：耆那教念珠",religion:"耆那教",coords:[72.5,23.0],
   desc:"耆那教以念珠持誦「五禮拜文」（Navkar Mantra），通常108顆，材質為珊瑚、水晶或菩提子。耆那教強調念珠是禪定工具而非裝飾，傳統可溯至大雄（Mahāvīra，約前599–527年）。耆那教念珠傳統與婆羅門教平行發展。",
   source:"Jain canonical texts (Āgamas); Paul Dundas, The Jains, 2nd ed. (2002)"},
  {id:4,year:-200,title:"北印度舍衛城：《木槵子經》故事原型地",religion:"佛教",coords:[82.5,27.5],
   desc:"據《佛說木槵子經》（T0786）記載，佛陀在拘薩羅國舍衛城（Śrāvastī）告憂惱王：「若欲滅煩惱障、報障者，當貫木槵子一百八箇，常自隨身……稱佛陀、達摩、僧伽名，乃過一粒。」此為佛教念珠念佛法門文獻最重要的源頭。學界注意到此經疑為中土撰述（牧田諦亮《疑經研究》）。",
   source:"《佛說木槵子經》，CBETA T0786，《大正藏》冊17；牧田諦亮《疑經研究》（1976）"},
  {id:5,year:310,title:"埃及上尼羅河：沙漠教父計數祈禱",religion:"基督教",coords:[31.2,26.8],
   desc:"沙漠教父（Desert Fathers）如帕科謬斯（Pachomius，292–348年）以打結羊毛繩索或小石頭計算禱告次數（每日300次以上「天主聖父」禱文），是基督教念珠最早形態。卡西安（John Cassian）《修院規則》亦記載埃及修士的計數祈禱法，為後世玫瑰經念珠的精神前身。",
   source:"Palladius, Lausiac History (419); Cassian, Institutes (c.420); Gougaud, Devotional and Ascetic Practices (1927)"},
  {id:6,year:400,title:"中國南朝：《木槵子經》漢譯流傳",religion:"佛教",coords:[118.8,32.1],
   desc:"《佛說木槵子經》（T0786，失譯）在中國漢譯流傳，確立佛教念珠108顆標準及稱名念佛法門，成為淨土念佛修行的核心輔具文獻。有學者考證此經可能為南朝中土撰述，反映中國佛教念珠修行的自身需求。",
   source:"《佛說木槵子經》，CBETA T0786，《大正藏》冊17；牧田諦亮《疑經研究》"},
  {id:7,year:645,title:"山西玄中寺：道綽《安樂集》念佛計數",religion:"佛教",coords:[112.0,37.7],
   desc:"淨土宗二祖道綽禪師（562–645年）在山西玄中寺著《安樂集》（T1958），記載以豆計算念佛次數：「每用小豆計數」，強調稱名念佛數量積累的重要性。此「以物計數念佛」是念珠念佛的直接先驅形態，對後世掐珠念佛傳統影響深遠。",
   source:"道綽《安樂集》，CBETA T1958，《大正藏》冊47"},
  {id:8,year:650,title:"阿拉伯半島：伊斯蘭念珠 Misbaha",religion:"伊斯蘭教",coords:[39.8,21.4],
   desc:"伊斯蘭念珠（Misbaha，又稱Subha或Tasbih）共99顆，代表真主99個尊名，用於唸誦「讚主聖」「讚美真主」「真主至大」各33遍。起源有學者（Goldziher等）認為受佛教或基督教影響；另有學者持獨立起源說。7世紀伊斯蘭興起後，此修行實踐逐步確立。",
   source:"Ignaz Goldziher, 'Über den Rosenkranz' (1889); Otto Spies, Zur Geschichte des Rosenkranzes (1951)"},
  {id:9,year:668,title:"長安西明寺：道世《法苑珠林》念珠記載",religion:"佛教",coords:[108.9,34.3],
   desc:"道世法師（？–683年）在長安西明寺編撰《法苑珠林》百卷（T2122），廣搜佛教故事與靈驗，其中含數條與念珠念佛相關的記述，是唐初念珠在修行中使用情況的重要史料彙編，反映唐代僧俗兩界念珠使用的日常化狀態。",
   source:"道世《法苑珠林》，CBETA T2122，《大正藏》冊53"},
  {id:10,year:670,title:"長安光明寺：善導大師稱名念佛計數",religion:"佛教",coords:[108.7,34.15],
   desc:"淨土宗三祖善導大師（613–681年）在長安光明寺廣弘念佛，著《觀無量壽佛經疏》（T1753）及《往生禮讚偈》（T1980），制定「每時念佛三萬聲、日夜六時」的精進計數規範，是最早的系統化念佛計數制度文獻，為後代掐珠念佛的核心思想淵源。",
   source:"善導《觀無量壽佛經疏》CBETA T1753；《往生禮讚偈》T1980，《大正藏》冊47"},
  {id:11,year:750,title:"長安：不空三藏譯念珠儀軌三種",religion:"佛教",coords:[109.1,34.45],
   desc:"密宗高僧不空（Amoghavajra，705–774年）譯出：①《金剛頂瑜伽念珠經》（T0789）詳述念珠密法儀軌；②《佛說校量數珠功德經》（T0790）比較各材質念珠功德倍數：「菩提子念一遍＝百萬遍，水晶念一遍＝一億遍」；③義淨（635–713年）另譯《佛說數珠功德經》（T0791）論功德。此三經對中國念珠使用的理論化影響至深。",
   source:"T0789、T0790、T0791，CBETA《大正藏》冊19"},
  {id:12,year:756,title:"日本奈良：正倉院藏念珠與《東大寺獻物帳》",religion:"佛教",coords:[135.8,34.7],
   desc:"正倉院保存天平時代（8世紀中期）念珠實物，日本現存最古老的念珠。《東大寺獻物帳》（756年）記載光明皇后獻納聖武天皇遺物，其中包括水晶念珠等，是日本念珠最早的文獻與實物並存佐證。念珠（juzu，数珠）隨遣唐使從中國傳入，奈良時代已融入宮廷佛教禮儀。",
   source:"《東大寺獻物帳》(756)；正倉院宝物目録；奈良国立博物館図録"},
  {id:13,year:760,title:"唐代：飛錫《念佛三昧寶王論》論述念珠念佛",religion:"佛教",coords:[108.5,34.05],
   desc:"唐代飛錫法師（8世紀中）著《念佛三昧寶王論》三卷（T0476），是中國佛教最早系統論述「念珠念佛」修行意義的專論：「手持念珠，念念相續，收攝六根，一心稱名。」強調以念珠攝心防散亂，論及念珠在日課念佛中的具體使用，對宋明念珠念佛的理論化影響深遠。",
   source:"飛錫《念佛三昧寶王論》，CBETA T0476，《大正藏》冊47"},
  {id:14,year:762,title:"西藏拉薩：藏傳佛教念珠傳統",religion:"佛教",coords:[91.1,29.6],
   desc:"蓮花生大士（Padmasambhava）於8世紀後半傳密法入藏，藏傳佛教念珠（藏語：Threngwa）傳統確立，108顆為標準，材質包括菩提子、骨珠（象徵無常）、珊瑚；用於持誦真言如「唵嘛呢叭咪吽」（觀世音六字真言）。後各宗派發展出豐富的念珠儀軌文獻。",
   source:"Nyingma tradition; Beer, The Handbook of Tibetan Buddhist Symbols (2003)"},
  {id:15,year:785,title:"五台山：法照大師《淨土五會念佛》",religion:"佛教",coords:[113.5,38.9],
   desc:"唐代法照禪師（？–約820年）在五台山大聖竹林寺創立「五會念佛」法，著《淨土五會念佛略法事儀讚》（T1983），以不同節奏（平緩至急速）輪替稱誦「南無阿彌陀佛」，修行者持念珠計數各會念誦次數。法照念佛儀式傳入宮廷，代宗、德宗皆供養，《宋高僧傳》卷二十一有其傳記。",
   source:"法照《淨土五會念佛略法事儀讚》，CBETA T1983，《大正藏》冊47；《宋高僧傳》卷21"},
  {id:16,year:1010,title:"天台山：遵式《往生淨土懺願儀》念珠念佛",religion:"佛教",coords:[121.0,29.1],
   desc:"北宋慈雲遵式（964–1032年）在天台山著《往生淨土懺願儀》，規定淨土懺悔儀軌中使用念珠計數稱名念佛的具體程序，是北宋天台淨土修行中念珠制度化的重要文獻。與四明知禮（960–1028年）共同推動宋代念佛運動，念珠在其儀軌中佔有固定位置，標誌掐珠念佛走向儀軌化。",
   source:"遵式《往生淨土懺願儀》，CBETA；陳揚炯《中國淨土宗通史》"},
  {id:17,year:1057,title:"英國考文垂：哥迪瓦夫人的念珠",religion:"基督教",coords:[-1.5,52.4],
   desc:"英國哥迪瓦夫人（Lady Godiva，卒約1067年）在遺囑中記載將一串寶石製成的「天主聖父念珠」（paternoster）懸掛於聖母像頸上獻祭。此為英國文獻中最早有明確記載的念珠，反映中世紀歐洲貴族念珠使用及「天主聖父禱文」（Pater Noster）與串珠計數的緊密結合。",
   source:"Roger of Wendover, Flores Historiarum (13th c.); Winston-Allen, Stories of the Rose (1997)"},
  {id:18,year:1090,title:"阿托斯山：東正教祈禱繩 Komboskini",religion:"基督教",coords:[24.3,40.1],
   desc:"東正教祈禱繩（希臘語：Komboskini；斯拉夫語：Chotki）以羊毛打結製成，通常33或100個結，用於持誦「耶穌禱文」：「主耶穌基督，神之子，憐憫我這罪人」，是東方靜修神學（Hesychasm）的核心工具。此傳統與阿托斯聖山修道院密切相關，約成形於10–11世紀。",
   source:"Hesychast tradition; Mount Athos practice; Brianchaninov, On Prayer (19th c.)"},
  {id:19,year:1160,title:"廬山周邊：王日休《龍舒增廣淨土文》掐珠念佛",religion:"佛教",coords:[115.9,29.6],
   desc:"宋代居士王日休（卒1173年）著《龍舒增廣淨土文》（T1970A），詳述掐珠念佛：「凡念佛，當持念珠，每念一聲，過一珠……可記念佛之數」，勸居士「每日課念萬聲乃至十萬聲」，並收錄多則持珠念佛往生靈驗故事，是宋代居士掐珠念佛最重要的文獻。",
   source:"王日休《龍舒增廣淨土文》，CBETA T1970A，《大正藏》冊47"},
  {id:20,year:1175,title:"朝鮮半島：高麗時代念珠文化",religion:"佛教",coords:[126.9,37.6],

   desc:"中世紀伊斯蘭世界，念珠（Misbaha）製作成重要工藝，以龍涎香、珊瑚、瑪瑙、象牙等名貴材質製作。波斯、土耳其均有精緻念珠工匠，奧斯曼蘇丹賞賜念珠的記錄反映其宮廷地位。15世紀奧斯曼帝國念珠匠行（Tesbihci Esnafı）是已知最早的專業念珠製作行會之一。",

// ── Globe ────────────────────────────────────────────────────────────────
function col(r){ return RELIGIONS[r]?.color||"#aaa"; }

const ctr = document.getElementById("globe-container");
let W=ctr.clientWidth, H=ctr.clientHeight, R=Math.min(W,H)*.42;

const svg = d3.select("#globe").attr("width",W).attr("height",H);
const proj = d3.geoOrthographic().scale(R).translate([W/2,H/2]).clipAngle(90).rotate([0,-25]);
const path = d3.geoPath().projection(proj);

const root=svg.append("g");
const sph=root.append("circle").attr("cx",W/2).attr("cy",H/2).attr("r",R).attr("fill","#0d1a30").attr("stroke","rgba(100,140,200,.15)").attr("stroke-width",1.5);
const grat=root.append("path").datum(d3.geoGraticule()()).attr("fill","none").attr("stroke","rgba(100,140,200,.06)").attr("stroke-width",.5);
const land=root.append("g");
const mkrs=root.append("g");

let worldData=null, curYear=1900, filt=null, selEv=null, autoRot=true;

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
  .then(r=>r.json()).then(w=>{
    worldData=w;
    land.selectAll("path").data(topojson.feature(w,w.objects.countries).features)
      .join("path").attr("fill","#1a2a3a").attr("stroke","rgba(120,160,200,.2)").attr("stroke-width",.4).attr("d",path);
    grat.attr("d",path);
    render();
  });

function render(){
  const evts=EVENTS.filter(e=>e.year<=curYear&&(!filt||e.religion===filt));
  mkrs.selectAll(".mg").remove();
  mkrs.selectAll(".mg").data(evts,d=>d.id).join("g").attr("class","mg")
    .style("cursor","pointer")
    .on("mouseover",(ev,d)=>{ tipShow(ev,d); d3.select(ev.currentTarget).select(".o").attr("r",9).attr("opacity",.6); })
    .on("mouseout", (ev,d)=>{ tipHide(); d3.select(ev.currentTarget).select(".o").attr("r",7).attr("opacity",.3); })
    .on("click",    (ev,d)=>{ ev.stopPropagation(); pick(d); })
    .each(function(d){
      const g=d3.select(this), p2=proj(d.coords);
      if(!p2) return;
      g.attr("transform","translate("+p2[0]+","+p2[1]+")");
      const a=d3.geoDistance(d.coords,[-proj.rotate()[0],-proj.rotate()[1]]);
      const v=a<Math.PI/2;
      g.attr("opacity",v?1:0).style("pointer-events",v?"all":"none");
      const c=col(d.religion);
      g.append("circle").attr("class","o").attr("r",7).attr("fill",c).attr("opacity",.3);
      g.append("circle").attr("class","i").attr("r",4).attr("fill",c).attr("opacity",.95).attr("stroke","#fff").attr("stroke-width",.5);
    });
  listPanel(evts);
}

function repaths(){
  if(!worldData) return;
  land.selectAll("path").data(topojson.feature(worldData,worldData.objects.countries).features).attr("d",path);
  grat.attr("d",path);
  sph.attr("cx",W/2).attr("cy",H/2);
}

// ── Panel ─────────────────────────────────────────────────────────────────
function listPanel(evts){
  const pan=document.getElementById("info-panel");
  if(!evts.length){pan.innerHTML='<div class="placeholder">此時間範圍內暫無記載</div>';return;}
  pan.innerHTML=[...evts].sort((a,b)=>a.year-b.year).map(e=>{
    const c=col(e.religion);
    const ys=e.year<0?`西元前 ${Math.abs(e.year)} 年`:`西元 ${e.year} 年`;
    const ac=selEv&&selEv.id===e.id?" active":"";
    return `<div class="ecard${ac}" data-id="${e.id}">
      <div class="yr">${ys}</div>
      <span class="rbadge" style="background:${c}22;color:${c};border:1px solid ${c}55">${e.religion}</span>
      <div class="ttl">${e.title}</div>
      <div class="dsc">${e.desc.slice(0,100)}…</div>
      <div class="src">📖 ${e.source.slice(0,75)}…</div></div>`;
  }).join("");
  pan.querySelectorAll(".ecard").forEach(c=>{
    c.addEventListener("click",()=>{const e=EVENTS.find(x=>x.id===+c.dataset.id);if(e)pick(e);});
  });
}

function detailPanel(d){
  const pan=document.getElementById("info-panel");
  const c=col(d.religion);
  const ys=d.year<0?`西元前 ${Math.abs(d.year)} 年`:`西元 ${d.year} 年`;
  pan.innerHTML=`<div style="margin-bottom:10px">
    <button id="bk" style="background:none;border:1px solid rgba(160,120,60,.4);color:#c8a03c;padding:3px 11px;border-radius:4px;cursor:pointer;font-size:.68rem;font-family:inherit">← 返回列表</button>
  </div>
  <div class="ecard active">
    <div class="yr" style="font-size:.78rem">${ys}</div>
    <span class="rbadge" style="background:${c}22;color:${c};border:1px solid ${c}55;font-size:.67rem">${d.religion} · ${RELIGIONS[d.religion]?.label.split(' ').slice(1).join(' ')||''}</span>
    <div class="ttl" style="font-size:.93rem;margin:7px 0">${d.title}</div>
    <div class="dsc" style="font-size:.74rem;color:#c0b090;line-height:1.85;white-space:pre-line">${d.desc}</div>
    <div class="src" style="font-size:.65rem">📖 ${d.source}</div>
  </div>`;
  document.getElementById("bk").addEventListener("click",()=>{
    selEv=null; listPanel(EVENTS.filter(e=>e.year<=curYear&&(!filt||e.religion===filt)));
  });
}

function pick(d){
  selEv=d;
  const rot=proj.rotate();
  d3.transition().duration(900).tween("r",()=>{
    const interp=d3.interpolate(rot,[-d.coords[0],-d.coords[1]+10]);
    return t=>{proj.rotate(interp(t));repaths();};
  }).on("end",render);
  detailPanel(d);
}

// ── Tooltip ───────────────────────────────────────────────────────────────
const tip=document.getElementById("tip");
function tipShow(ev,d){
  const ys=d.year<0?`前${Math.abs(d.year)}年`:`${d.year}年`;
  tip.innerHTML=`<strong>${d.title}</strong><br><span style="color:#9a8a6a">${ys} · ${d.religion}</span>`;
  tip.style.display="block";tipMove(ev);
}
function tipHide(){tip.style.display="none";}
function tipMove(ev){if(tip.style.display==="none")return;tip.style.left=(ev.clientX+14)+"px";tip.style.top=(ev.clientY-10)+"px";}
svg.on("mousemove",tipMove);

// ── Drag & zoom ───────────────────────────────────────────────────────────
let dg=null;
svg.call(d3.drag()
  .on("start",ev=>{dg={x:ev.x,y:ev.y,r:proj.rotate().slice()};autoRot=false;})
  .on("drag", ev=>{if(!dg)return;proj.rotate([dg.r[0]+(ev.x-dg.x)*.25,dg.r[1]-(ev.y-dg.y)*.25]);repaths();render();})
  .on("end",  ()=>{setTimeout(()=>{autoRot=true;},3000);})
);
svg.call(d3.zoom().scaleExtent([.5,3]).on("zoom",ev=>{const s=ev.transform.k*R;proj.scale(s);sph.attr("r",s);repaths();render();}));

// ── Auto rotate ───────────────────────────────────────────────────────────
d3.timer(()=>{if(!autoRot)return;const r=proj.rotate();proj.rotate([r[0]+.1,r[1]]);repaths();render();});

// ── Timeline ──────────────────────────────────────────────────────────────
const tsl=document.getElementById("tslider");
const yd=document.getElementById("yd");
function updateSlider(v){
  const pct=((v-(-3000))/(1900-(-3000))*100).toFixed(1);
  tsl.style.setProperty("--p",pct+"%");
  yd.textContent=v>=1900?"顯示所有年代":v<0?`西元前 ${Math.abs(v)} 年`:`西元 ${v} 年`;
}
tsl.addEventListener("input",function(){curYear=+this.value;updateSlider(curYear);render();});
updateSlider(1900);

// ── Legend ────────────────────────────────────────────────────────────────
const leg=document.getElementById("legend");
Object.entries(RELIGIONS).forEach(([k,v])=>{
  const it=document.createElement("div"); it.className="litm";
  it.innerHTML=`<div class="ldot" style="background:${v.color}"></div><span>${v.label}</span>`;
  it.addEventListener("click",()=>{
    if(filt===k){filt=null;document.querySelectorAll(".litm").forEach(x=>x.classList.remove("dim"));}
    else{filt=k;document.querySelectorAll(".litm").forEach(x=>x.classList.add("dim"));it.classList.remove("dim");}
    render();
  });
  leg.appendChild(it);
});

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener("resize",()=>{
  W=ctr.clientWidth;H=ctr.clientHeight;R=Math.min(W,H)*.42;
  svg.attr("width",W).attr("height",H);
  proj.translate([W/2,H/2]).scale(R);
  sph.attr("cx",W/2).attr("cy",H/2).attr("r",R);
  repaths();render();
});
</script>
</body>
