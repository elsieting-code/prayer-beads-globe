// ── Globe setup ───────────────────────────────────────────────────────────
function getColor(r){ return RELIGIONS[r]?.color || "#aaa"; }

const container = document.getElementById("globe-container");
let W = container.clientWidth, H = container.clientHeight;
let R = Math.min(W,H) * 0.42;

const svg = d3.select("#globe").attr("width",W).attr("height",H);
const projection = d3.geoOrthographic()
  .scale(R).translate([W/2,H/2]).clipAngle(90).rotate([0,-25]);
const pathGen = d3.geoPath().projection(projection);

const gG = svg.append("g");
const sphereEl = gG.append("circle").attr("cx",W/2).attr("cy",H/2).attr("r",R)
  .attr("fill","#0d1a30").attr("stroke","rgba(100,140,200,.15)").attr("stroke-width",1.5);
const graticuleEl = gG.append("path").datum(d3.geoGraticule()())
  .attr("fill","none").attr("stroke","rgba(100,140,200,.06)").attr("stroke-width",.5);
const landEl = gG.append("g");
const markersEl = gG.append("g");

let worldData = null, currentYear = 1900, activeFilter = null, activeEvent = null;

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
  .then(r=>r.json()).then(world=>{
    worldData = world;
    landEl.selectAll("path").data(topojson.feature(world,world.objects.countries).features)
      .join("path").attr("fill","#1a2a3a").attr("stroke","rgba(120,160,200,.2)")
      .attr("stroke-width",.4).attr("d",pathGen);
    graticuleEl.attr("d",pathGen);
    renderMarkers();
  });

function renderMarkers(){
  const filtered = EVENTS.filter(e=>e.year<=currentYear&&(!activeFilter||e.religion===activeFilter));
  markersEl.selectAll(".mg").remove();
  const groups = markersEl.selectAll(".mg").data(filtered,d=>d.id).join("g").attr("class","mg")
    .style("cursor","pointer")
    .on("mouseover",(ev,d)=>{ showTip(ev,d); d3.select(ev.currentTarget).select(".or").attr("r",9).attr("opacity",.6); })
    .on("mouseout",(ev,d)=>{ hideTip(); d3.select(ev.currentTarget).select(".or").attr("r",7).attr("opacity",.3); })
    .on("click",(ev,d)=>{ ev.stopPropagation(); selectEvent(d); });

  groups.each(function(d){
    const g = d3.select(this);
    const proj = projection(d.coords);
    if(!proj) return;
    const [x,y]=proj;
    g.attr("transform",`translate(${x},${y})`);
    const angle = d3.geoDistance(d.coords,[-projection.rotate()[0],-projection.rotate()[1]]);
    const vis = angle < Math.PI/2;
    g.attr("opacity",vis?1:0).style("pointer-events",vis?"all":"none");
    const col = getColor(d.religion);
    g.append("circle").attr("class","or").attr("r",7).attr("fill",col).attr("opacity",.3);
    g.append("circle").attr("class","ir").attr("r",4).attr("fill",col).attr("opacity",.95)
      .attr("stroke","#fff").attr("stroke-width",.5);
  });
  updatePanel(filtered);
}

// ── Info panel ────────────────────────────────────────────────────────────
function updatePanel(events){
  const panel = document.getElementById("info-panel");
  if(!events.length){ panel.innerHTML=`<div class="placeholder">此時間範圍內<br>暫無記載</div>`; return; }
  const sorted = [...events].sort((a,b)=>a.year-b.year);
  panel.innerHTML = sorted.map(e=>{
    const col=getColor(e.religion);
    const ys = e.year<0?`西元前 ${Math.abs(e.year)} 年`:`西元 ${e.year} 年`;
    const active = activeEvent&&activeEvent.id===e.id?"active":"";
    return `<div class="event-card ${active}" data-id="${e.id}">
      <div class="year-tag">${ys}</div>
      <span class="religion-badge" style="background:${col}22;color:${col};border:1px solid ${col}55">${e.religion}</span>
      <div class="title">${e.title}</div>
      <div class="desc">${e.desc.slice(0,110)}…</div>
      <div class="source">📖 ${e.source.slice(0,80)}…</div>
    </div>`;
  }).join("");
  panel.querySelectorAll(".event-card").forEach(c=>{
    c.addEventListener("click",()=>{ const ev=EVENTS.find(e=>e.id===+c.dataset.id); if(ev) selectEvent(ev); });
  });
}

function selectEvent(d){
  activeEvent=d;
  const [lng,lat]=d.coords, rot=projection.rotate();
  d3.transition().duration(900).tween("rotate",()=>{
    const r=d3.interpolate(rot,[-lng,-lat+10]);
    return t=>{ projection.rotate(r(t)); updatePaths(); };
  }).on("end",renderMarkers);
  showDetail(d);
}

function showDetail(d){
  const panel=document.getElementById("info-panel");
  const col=getColor(d.religion);
  const ys=d.year<0?`西元前 ${Math.abs(d.year)} 年`:`西元 ${d.year} 年`;
  panel.innerHTML=`
    <div style="margin-bottom:10px">
      <button id="back-btn" style="background:none;border:1px solid rgba(160,120,60,.4);color:#c8a03c;
        padding:4px 12px;border-radius:4px;cursor:pointer;font-size:.7rem;font-family:inherit">← 返回列表</button>
    </div>
    <div class="event-card active">
      <div class="year-tag" style="font-size:.8rem">${ys}</div>
      <span class="religion-badge" style="background:${col}22;color:${col};border:1px solid ${col}55;font-size:.68rem">
        ${d.religion} · ${RELIGIONS[d.religion]?.label.split(' ').slice(1).join(' ')||''}
      </span>
      <div class="title" style="font-size:.95rem;margin:7px 0">${d.title}</div>
      <div class="desc" style="font-size:.76rem;color:#c0b090;line-height:1.85;white-space:pre-line">${d.desc}</div>
      <div class="source" style="font-size:.67rem">📖 ${d.source}</div>
    </div>`;
  document.getElementById("back-btn").addEventListener("click",()=>{
    activeEvent=null;
    updatePanel(EVENTS.filter(e=>e.year<=currentYear&&(!activeFilter||e.religion===activeFilter)));
  });
}

// ── Tooltip ───────────────────────────────────────────────────────────────
const tip=document.getElementById("tooltip");
function showTip(ev,d){
  const ys=d.year<0?`前${Math.abs(d.year)}年`:`${d.year}年`;
  tip.innerHTML=`<strong>${d.title}</strong><br><span style="color:#9a8a6a">${ys} · ${d.religion}</span>`;
  tip.style.display="block"; moveTip(ev);
}
function hideTip(){ tip.style.display="none"; }
svg.on("mousemove",moveTip);
function moveTip(ev){ if(tip.style.display==="none") return; tip.style.left=(ev.clientX+14)+"px"; tip.style.top=(ev.clientY-10)+"px"; }

// ── Drag & zoom ───────────────────────────────────────────────────────────
let ds=null;
svg.call(d3.drag()
  .on("start",ev=>{ ds={x:ev.x,y:ev.y,rot:projection.rotate().slice()}; autoRotate=false; })
  .on("drag",ev=>{
    if(!ds) return;
    projection.rotate([ds.rot[0]+(ev.x-ds.x)*.25, ds.rot[1]-(ev.y-ds.y)*.25]);
    updatePaths(); renderMarkers();
  })
  .on("end",()=>{ setTimeout(()=>autoRotate=true,3000); })
);
svg.call(d3.zoom().scaleExtent([.5,3]).on("zoom",ev=>{
  const s=ev.transform.k*R;
  projection.scale(s); sphereEl.attr("r",s); updatePaths(); renderMarkers();
}));

function updatePaths(){
  if(!worldData) return;
  landEl.selectAll("path").data(topojson.feature(worldData,worldData.objects.countries).features).attr("d",pathGen);
  graticuleEl.attr("d",pathGen);
  sphereEl.attr("cx",W/2).attr("cy",H/2);
}

let autoRotate=true;
d3.timer(()=>{ if(!autoRotate) return; const r=projection.rotate(); projection.rotate([r[0]+.1,r[1]]); updatePaths(); renderMarkers(); });

// ── Timeline ──────────────────────────────────────────────────────────────
const slider=document.getElementById("timeline-slider");
slider.addEventListener("input",function(){
  currentYear=+this.value;
  const pct=((currentYear-+this.min)/(+this.max-+this.min)*100).toFixed(1);
  this.style.setProperty("--pct",pct+"%");
  document.getElementById("year-display").textContent =
    currentYear===1900?"顯示所有年代":currentYear<0?`西元前 ${Math.abs(currentYear)} 年以前`:`西元 ${currentYear} 年以前`;
  renderMarkers();
});
// init slider position
(()=>{ const pct=((1900-(-3000))/(1900-(-3000))*100).toFixed(1); slider.style.setProperty("--pct",pct+"%"); })();

// ── Legend ────────────────────────────────────────────────────────────────
const legendEl=document.getElementById("legend");
Object.entries(RELIGIONS).forEach(([key,val])=>{
  const item=document.createElement("div"); item.className="legend-item";
  item.innerHTML=`<div class="legend-dot" style="background:${val.color}"></div><span>${val.label}</span>`;
  item.addEventListener("click",()=>{
    if(activeFilter===key){ activeFilter=null; document.querySelectorAll(".legend-item").forEach(i=>i.classList.remove("dimmed")); }
    else { activeFilter=key; document.querySelectorAll(".legend-item").forEach(i=>i.classList.add("dimmed")); item.classList.remove("dimmed"); }
    renderMarkers();
  });
  legendEl.appendChild(item);
});

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener("resize",()=>{
  W=container.clientWidth; H=container.clientHeight; R=Math.min(W,H)*.42;
  svg.attr("width",W).attr("height",H);
  projection.translate([W/2,H/2]).scale(R);
  sphereEl.attr("cx",W/2).attr("cy",H/2).attr("r",R);
  updatePaths(); renderMarkers();
});
</script>
